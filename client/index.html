<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Remote Terminal</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="terminal">
        <div class="titlebar">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="title">
                telegram-remote
            </div>
        </div>

        <div class="body" id="terminal">
            <div class="line output">
                Telegram Remote Terminal
            </div>

            <div class="line output">
                Ready.
            </div>

            <br>

            <div class="input-line">
                <span class="prompt">$</span>

                <input
                    id="input"
                    class="input"
                    type="text"
                    autocomplete="off"
                    autofocus
                    spellcheck="false"
                >
            </div>
        </div>
    </div>

    <script src="/main.js"></script>
</body>
</html>
